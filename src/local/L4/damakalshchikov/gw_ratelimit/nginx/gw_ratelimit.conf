# Подключение компонента gw_ratelimit (модуль ограничения нагрузки, njs-модуль gw_ratelimit.js) в api_gateway.
# Требуется njs >= 0.8.8 с движком QuickJS (поддержка классов ES2020 и общих зон).
# Файл подключается в блоке http { } основного nginx.conf шлюза.

load_module modules/ngx_http_js_module.so;   # строка переносится в верхний уровень nginx.conf

js_engine qjs;
js_path "/etc/nginx/njs/";
js_import gw from gw_ratelimit.js;           # dist/gw_ratelimit.js после `npm run build`

# Общая для всех worker-процессов зона счётчиков: числа, срок жизни по умолчанию 2 мин,
# при переполнении вытесняются самые старые ключи.
js_shared_dict_zone zone=ratelimit:8m timeout=120s type=number evict;

# Число одновременных соединений с одного IP остаётся на штатном limit_conn.
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 443 ssl;
    http2 on;
    # ... модуль проверки TLS-сертификата (tls_comp): ssl_certificate, ssl_protocols TLSv1.3 ...

    limit_conn perip 50;

    # Все входящие запросы сначала проходят gw_ratelimit.
    location / {
        js_content gw.handle;
    }

    # Следующий модуль для пользовательских запросов: gw_authcheck -> gw_router.
    location @user_api {
        auth_request /_auth_verify;
        # gw_router: внутри именованного location выбор upstream по префиксу пути через map:
        # map $uri $api_upstream { ~^/api/v1/auth/ auth_service; ~^/api/v1/access/ iot_service; ... }
        proxy_pass http://$api_upstream;
    }

    # Следующий модуль для внешних систем: gw_partner (allow/deny по доверенным адресам).
    location @partner {
        # ... allow <адреса платёжного шлюза и BI>; deny all; proxy_pass ...
    }
}
